name: pythilo-web
services:
  site:
    build:
      context: .
      dockerfile: hetzner/Dockerfile.prebuilt
    image: localhost/pythilo-web-site:${PYTHILO_SITE_TAG:?Set a release tag}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PYTHILO_SITE_PORT:-3212}:8080"
    environment:
      # The public origin, https://<domain>. The relay refuses browser requests from any other origin.
      SITE_ORIGIN: ${PYTHILO_SITE_ORIGIN:?Set the public origin, for example https://<domain>}
    # Rooms live in this process's memory only: no volume, nothing to back up.
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
